name: Build, Push & Deploy API Pre

on:
  push:
    branches:
      - pre
    paths:
      - 'apps/api/**'
      - 'packages/shared-types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-api-pre.yml'
  workflow_dispatch:

jobs:
  test-api-pre:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Run API tests
        run: pnpm --filter api test --runInBand

  build-and-push-pre:
    needs: test-api-pre
    runs-on: ubuntu-latest
    environment: pre

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API pre image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:pre \
            .

      - name: Push API pre image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:pre

  deploy-pre:
    needs: [test-api-pre, build-and-push-pre]
    runs-on: [self-hosted, welmio]
    environment: pre

    steps:
      - name: Deploy API on pre server environment
        run: |
          cd /opt/welmio/pre
          docker compose pull api
          docker compose up -d api
