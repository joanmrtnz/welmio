name: Build, Push & Deploy APP

on:
  push:
    branches:
      - pre
      - prod
    paths:
      - 'apps/app/**'
      - 'packages/shared-types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'

jobs:
  build-and-push:
    if: github.ref_name == 'prod'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build APP image
        run: |
          docker build \
            -f apps/app/Dockerfile \
            --build-arg EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:prod \
            .

      - name: Push APP image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:prod

  deploy:
    if: github.ref_name == 'prod'
    needs: build-and-push
    runs-on: [self-hosted, welmio, prod]

    steps:
      - name: Deploy on server
        run: |
          cd /opt/welmio
          docker compose pull app-web
          docker compose up -d app-web