name: Build, Push & Deploy API Prod

on:
  push:
    tags:
      - 'api-v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'API image tag to deploy, example: api-v1.0.0'
        required: true
        type: string

jobs:
  test-api-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm --filter api test --runInBand

  build-and-push-prod:
    if: github.event_name == 'push'
    needs: test-api-prod
    runs-on: ubuntu-latest
    environment: prod
    env:
      IMAGE_TAG: ${{ github.ref_name }}

    steps:
      - name: Validate API production tag
        run: |
          case "$IMAGE_TAG" in
            api-v*) echo "Building $IMAGE_TAG" ;;
            *) echo "Invalid API tag: $IMAGE_TAG. Expected api-v*" && exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API production image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:${IMAGE_TAG}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:prod" \
            .

      - name: Push API production image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:${IMAGE_TAG}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:prod"

  deploy-prod:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.build-and-push-prod.result == 'success') }}
    needs: [test-api-prod, build-and-push-prod]
    runs-on: [self-hosted, welmio]
    environment: prod
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}

    steps:
      - name: Validate API deploy tag
        run: |
          case "$IMAGE_TAG" in
            api-v*) echo "Deploying $IMAGE_TAG" ;;
            *) echo "Invalid API tag: $IMAGE_TAG. Expected api-v*" && exit 1 ;;
          esac

      - name: Deploy API on production server environment
        run: |
          cd /opt/welmio/prod
          cp .env .env.backup

          if grep -q '^API_IMAGE_TAG=' .env; then
            sed -i "s/^API_IMAGE_TAG=.*/API_IMAGE_TAG=${IMAGE_TAG}/" .env
          else
            printf '\nAPI_IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
          fi

          docker compose pull api
          docker compose up -d api
