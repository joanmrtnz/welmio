name: Build, Push & Deploy APP Pre

on:
  push:
    branches:
      - pre
    paths:
      - 'apps/app/**'
      - 'packages/shared-types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-app-pre.yml'
  workflow_dispatch:

jobs:
  build-and-push-pre:
    runs-on: ubuntu-latest
    environment: pre

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate pre APP environment
        run: |
          test -n "${{ vars.EXPO_PUBLIC_API_URL_PRE }}"
          test -n "${{ vars.EXPO_PUBLIC_WELMIO_APP_URL_PRE }}"
          echo "APP pre public environment is configured"

      - name: Build APP pre image
        run: |
          docker build \
            -f apps/app/Dockerfile \
            --build-arg "EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL_PRE }}" \
            --build-arg "EXPO_PUBLIC_WELMIO_APP_URL=${{ vars.EXPO_PUBLIC_WELMIO_APP_URL_PRE }}" \
            --build-arg "APP_IMAGE_TAG=${{ github.sha }}" \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:pre \
            .

      - name: Push APP pre image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:pre

  deploy-pre:
    needs: build-and-push-pre
    runs-on: [self-hosted, welmio]
    environment: pre

    steps:
      - name: Deploy APP on pre server environment
        run: |
          cd /opt/welmio/pre
          docker compose pull app-web
          docker compose up -d --force-recreate app-web
