name: Build, Push & Deploy WEB Pre

on:
  push:
    branches:
      - pre
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-web-pre.yml'
  workflow_dispatch:

jobs:
  build-and-push-pre:
    runs-on: ubuntu-latest
    environment: pre

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate pre WEB environment
        run: |
          test -n "${{ vars.NEXT_PUBLIC_WELMIO_WEB_APP_URL_PRE }}"
          test -n "${{ vars.NEXT_PUBLIC_WELMIO_GITHUB_URL }}"
          test -n "${{ vars.NEXT_PUBLIC_WELMIO_CONTACT_EMAIL_PRE }}"
          echo "WEB pre public environment is configured"

      - name: Build WEB pre image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_WELMIO_WEB_APP_URL=${{ vars.NEXT_PUBLIC_WELMIO_WEB_APP_URL_PRE }}" \
            --build-arg "NEXT_PUBLIC_WELMIO_GITHUB_URL=${{ vars.NEXT_PUBLIC_WELMIO_GITHUB_URL }}" \
            --build-arg "NEXT_PUBLIC_WELMIO_LINKEDIN_URL=${{ vars.NEXT_PUBLIC_WELMIO_LINKEDIN_URL }}" \
            --build-arg "NEXT_PUBLIC_WELMIO_TWITTER_URL=${{ vars.NEXT_PUBLIC_WELMIO_TWITTER_URL }}" \
            --build-arg "NEXT_PUBLIC_WELMIO_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_WELMIO_CONTACT_EMAIL_PRE }}" \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio:pre \
            .

      - name: Push WEB pre image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio:pre

  deploy-pre:
    needs: build-and-push-pre
    runs-on: [self-hosted, welmio]
    environment: pre

    steps:
      - name: Deploy WEB on pre server environment
        run: |
          cd /opt/welmio/pre
          docker compose pull welmio
          docker compose up -d welmio
