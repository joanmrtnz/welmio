name: Build, Push & Deploy WEB

on:
  push:
    branches:
      - pre
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-web.yml'
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-and-push-pre:
    if: github.event_name == 'push' && github.ref_name == 'pre'
    runs-on: ubuntu-latest
    environment: pre

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build WEB pre image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio:pre \
            .

      - name: Push WEB pre image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio:pre

  deploy-pre:
    if: github.event_name == 'push' && github.ref_name == 'pre'
    needs: build-and-push-pre
    runs-on: [self-hosted, welmio]
    environment: pre

    steps:
      - name: Deploy WEB on pre server environment
        run: |
          cd /opt/welmio/pre
          docker compose pull welmio
          docker compose up -d welmio

  build-and-push-prod:
    if: github.event_name == 'release' && github.event.action == 'published' && startsWith(github.event.release.tag_name, 'web-v')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build WEB production image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio:${{ github.event.release.tag_name }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio:prod \
            .

      - name: Push WEB production image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio:${{ github.event.release.tag_name }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio:prod

  deploy-prod:
    if: github.event_name == 'release' && github.event.action == 'published' && startsWith(github.event.release.tag_name, 'web-v')
    needs: build-and-push-prod
    runs-on: [self-hosted, welmio]
    environment: prod

    steps:
      - name: Deploy WEB on production server environment
        run: |
          cd /opt/welmio/prod
          if grep -q '^WEB_IMAGE_TAG=' .env; then
            sed -i 's/^WEB_IMAGE_TAG=.*/WEB_IMAGE_TAG=${{ github.event.release.tag_name }}/' .env
          else
            printf '\nWEB_IMAGE_TAG=${{ github.event.release.tag_name }}\n' >> .env
          fi
          docker compose pull welmio
          docker compose up -d welmio
