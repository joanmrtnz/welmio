name: Build, Push & Deploy API

on:
  push:
    branches:
      - pre
      - prod
    paths:
      - 'apps/api/**'
      - 'packages/shared-types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'

jobs:
  build-and-push:
    if: github.ref_name == 'prod'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:prod \
            .

      - name: Push API image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:prod

  deploy:
    if: github.ref_name == 'prod'
    needs: build-and-push
    runs-on: [self-hosted, welmio, prod]

    steps:
      - name: Deploy on server
        run: |
          cd /opt/welmio
          docker compose pull api
          docker compose up -d api