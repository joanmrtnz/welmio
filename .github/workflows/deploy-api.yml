name: Build, Push & Deploy API

on:
  push:
    branches:
      - pre
    paths:
      - 'apps/api/**'
      - 'packages/shared-types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/**'
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-and-push-pre:
    if: github.event_name == 'push' && github.ref_name == 'pre'
    runs-on: ubuntu-latest
    environment: pre

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API pre image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:pre \
            .

      - name: Push API pre image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:pre

  deploy-pre:
    if: github.event_name == 'push' && github.ref_name == 'pre'
    needs: build-and-push-pre
    runs-on: [self-hosted, welmio]
    environment: pre

    steps:
      - name: Deploy API on pre server environment
        run: |
          cd /opt/welmio/pre
          docker compose pull api
          docker compose up -d api

  build-and-push-prod:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API production image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:${{ github.event.release.tag_name }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:prod \
            .

      - name: Push API production image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:${{ github.event.release.tag_name }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/welmio-api:prod

  deploy-prod:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-and-push-prod
    runs-on: [self-hosted, welmio]
    environment: prod

    steps:
      - name: Deploy API on production server environment
        run: |
          cd /opt/welmio/prod
          docker compose pull api
          docker compose up -d api
