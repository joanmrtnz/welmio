name: Build, Push & Deploy APP Prod

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'APP image tag to deploy, example: app-v1.0.0'
        required: true
        type: string

jobs:
  build-and-push-prod:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    env:
      IMAGE_TAG: ${{ github.ref_name }}

    steps:
      - name: Validate APP production tag
        run: |
          case "$IMAGE_TAG" in
            app-v*) echo "Building $IMAGE_TAG" ;;
            *) echo "Invalid APP tag: $IMAGE_TAG. Expected app-v*" && exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate production APP environment
        run: |
          test -n "${{ vars.EXPO_PUBLIC_API_URL }}"
          test -n "${{ vars.EXPO_PUBLIC_WELMIO_APP_URL }}"
          echo "APP production public environment is configured"

      - name: Build APP production image
        run: |
          docker build \
            -f apps/app/Dockerfile \
            --build-arg "EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL }}" \
            --build-arg "EXPO_PUBLIC_WELMIO_APP_URL=${{ vars.EXPO_PUBLIC_WELMIO_APP_URL }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:${IMAGE_TAG}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:prod" \
            .

      - name: Push APP production image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:${IMAGE_TAG}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/welmio-app:prod"

  deploy-prod:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.build-and-push-prod.result == 'success') }}
    needs: build-and-push-prod
    runs-on: [self-hosted, welmio]
    environment: prod
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}

    steps:
      - name: Validate APP deploy tag
        run: |
          case "$IMAGE_TAG" in
            app-v*) echo "Deploying $IMAGE_TAG" ;;
            *) echo "Invalid APP tag: $IMAGE_TAG. Expected app-v*" && exit 1 ;;
          esac

      - name: Deploy APP on production server environment
        run: |
          cd /opt/welmio/prod
          cp .env .env.backup

          if grep -q '^APP_IMAGE_TAG=' .env; then
            sed -i "s/^APP_IMAGE_TAG=.*/APP_IMAGE_TAG=${IMAGE_TAG}/" .env
          else
            printf '\nAPP_IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
          fi

          docker compose pull app-web
          docker compose up -d app-web
