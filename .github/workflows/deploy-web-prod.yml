name: Build, Push & Deploy WEB Prod

on:
  push:
    tags:
      - 'web-v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'WEB image tag to deploy, example: web-v1.0.0'
        required: true
        type: string

jobs:
  build-and-push-prod:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    env:
      IMAGE_TAG: ${{ github.ref_name }}

    steps:
      - name: Validate WEB production tag
        run: |
          case "$IMAGE_TAG" in
            web-v*) echo "Building $IMAGE_TAG" ;;
            *) echo "Invalid WEB tag: $IMAGE_TAG. Expected web-v*" && exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate production WEB environment
        run: |
          test -n "${{ vars.NEXT_PUBLIC_WELMIO_WEB_APP_URL }}"
          test -n "${{ vars.NEXT_PUBLIC_WELMIO_GITHUB_URL }}"
          test -n "${{ vars.NEXT_PUBLIC_WELMIO_CONTACT_EMAIL }}"
          echo "WEB production public environment is configured"

      - name: Build WEB production image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_WELMIO_WEB_APP_URL=${{ vars.NEXT_PUBLIC_WELMIO_WEB_APP_URL }}" \
            --build-arg "NEXT_PUBLIC_WELMIO_GITHUB_URL=${{ vars.NEXT_PUBLIC_WELMIO_GITHUB_URL }}" \
            --build-arg "NEXT_PUBLIC_WELMIO_LINKEDIN_URL=${{ vars.NEXT_PUBLIC_WELMIO_LINKEDIN_URL }}" \
            --build-arg "NEXT_PUBLIC_WELMIO_TWITTER_URL=${{ vars.NEXT_PUBLIC_WELMIO_TWITTER_URL }}" \
            --build-arg "NEXT_PUBLIC_WELMIO_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_WELMIO_CONTACT_EMAIL }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/welmio:${IMAGE_TAG}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/welmio:prod" \
            .

      - name: Push WEB production image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/welmio:${IMAGE_TAG}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/welmio:prod"

  deploy-prod:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.build-and-push-prod.result == 'success') }}
    needs: build-and-push-prod
    runs-on: [self-hosted, welmio]
    environment: prod
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}

    steps:
      - name: Validate WEB deploy tag
        run: |
          case "$IMAGE_TAG" in
            web-v*) echo "Deploying $IMAGE_TAG" ;;
            *) echo "Invalid WEB tag: $IMAGE_TAG. Expected web-v*" && exit 1 ;;
          esac

      - name: Deploy WEB on production server environment
        run: |
          cd /opt/welmio/prod
          cp .env .env.backup

          if grep -q '^WEB_IMAGE_TAG=' .env; then
            sed -i "s/^WEB_IMAGE_TAG=.*/WEB_IMAGE_TAG=${IMAGE_TAG}/" .env
          else
            printf '\nWEB_IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
          fi

          docker compose pull welmio
          docker compose up -d welmio
